services:
  agenthill:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    # Lets the container reach Ollama running on the host. Built in on Docker Desktop (macOS/Windows);
    # this mapping makes it work on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agenthill-var:/app/var
volumes:
  agenthill-var:
